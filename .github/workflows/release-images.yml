name: release production images

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gn_system_test
          POSTGRES_USER: gn_system
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gn_system -d gn_system_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: false
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: gn_system_test
      DB_USERNAME: gn_system
      DB_PASSWORD: test-password
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: 127.0.0.1
      SESSION_DRIVER: array
      MAIL_MAILER: array

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release mode
        id: release
        shell: bash
        run: |
          set -euo pipefail

          release_tag=${GITHUB_REF_NAME}
          if [[ ${release_tag} =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            echo "mode=rc" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! ${release_tag} =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release tag: ${release_tag}" >&2
            exit 1
          fi

          candidate_tag=
          while IFS= read -r rc_tag; do
            if [[ $(git rev-list -n 1 "${rc_tag}") == "${GITHUB_SHA}" ]]; then
              candidate_tag=${rc_tag}
              break
            fi
          done < <(git tag --list "${release_tag}-rc.*" --sort=-version:refname)

          if [[ -z ${candidate_tag} ]]; then
            echo "No RC tag for ${release_tag} points to ${GITHUB_SHA}." >&2
            exit 1
          fi

          echo "mode=stable" >> "$GITHUB_OUTPUT"
          echo "candidate_tag=${candidate_tag}" >> "$GITHUB_OUTPUT"

      - name: Install PDF font dependencies
        if: steps.release.outputs.mode == 'rc'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes fonts-noto-cjk poppler-utils python3-fonttools
          sudo python3 scripts/build-cjk-font.py /tmp/GNSystemSans-Regular.ttf /tmp/GNSystemSans-Bold.ttf
          sudo install -D -m 0644 /tmp/GNSystemSans-Regular.ttf /usr/local/share/fonts/gn-system/GNSystemSans-Regular.ttf
          sudo install -D -m 0644 /tmp/GNSystemSans-Bold.ttf /usr/local/share/fonts/gn-system/GNSystemSans-Bold.ttf
          test -r /usr/local/share/fonts/gn-system/GNSystemSans-Regular.ttf
          test -r /usr/local/share/fonts/gn-system/GNSystemSans-Bold.ttf

      - name: Setup PHP
        if: steps.release.outputs.mode == 'rc'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: bcmath, gd, intl, mbstring, pdo_pgsql, redis, zip
          tools: composer:v2
          coverage: none

      - name: Setup Node
        if: steps.release.outputs.mode == 'rc'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Run release gates
        if: steps.release.outputs.mode == 'rc'
        run: |
          cp .env.testing.example .env.testing
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env.testing
          printf '\nDB_PASSWORD=%s\n' "$DB_PASSWORD" >> .env.testing
          composer install --no-interaction --prefer-dist --no-progress
          npm ci
          npm run build
          composer validate --strict
          composer audit
          npm audit --audit-level=high
          php artisan migrate --force
          composer ci:check

      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image names
        run: |
          echo "APP_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gn-system-app" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gn-system-web" >> "$GITHUB_ENV"

      - name: Build and push app image
        if: steps.release.outputs.mode == 'rc'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:${{ github.ref_name }}
            ${{ env.APP_IMAGE }}:sha-${{ github.sha }}

      - name: Build and push web image
        if: steps.release.outputs.mode == 'rc'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: web-production
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ github.ref_name }}
            ${{ env.WEB_IMAGE }}:sha-${{ github.sha }}

      - name: Promote accepted RC images
        if: steps.release.outputs.mode == 'stable'
        env:
          CANDIDATE_TAG: ${{ steps.release.outputs.candidate_tag }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          app_source="${APP_IMAGE}:${CANDIDATE_TAG}"
          app_target="${APP_IMAGE}:${RELEASE_TAG}"
          web_source="${WEB_IMAGE}:${CANDIDATE_TAG}"
          web_target="${WEB_IMAGE}:${RELEASE_TAG}"

          inspect_manifest() {
            local image_ref=$1

            docker buildx imagetools inspect \
              --format '{{json .Manifest}}' "${image_ref}" \
              | jq -ce '
                if (.mediaType | type) != "string"
                  or (.digest | type) != "string"
                  or (.digest | test("^sha256:[0-9a-f]{64}$") | not)
                then
                  error("manifest must contain a valid mediaType and sha256 digest")
                else
                  {mediaType, digest}
                end
              '
          }

          source_app_manifest=$(inspect_manifest "${app_source}")
          source_web_manifest=$(inspect_manifest "${web_source}")
          source_app_type=$(jq -r '.mediaType' <<<"${source_app_manifest}")
          source_app_digest=$(jq -r '.digest' <<<"${source_app_manifest}")
          source_web_type=$(jq -r '.mediaType' <<<"${source_web_manifest}")
          source_web_digest=$(jq -r '.digest' <<<"${source_web_manifest}")

          printf 'Accepted RC manifests:\napp: %s (%s)\nweb: %s (%s)\n' \
            "${source_app_digest}" "${source_app_type}" \
            "${source_web_digest}" "${source_web_type}"

          docker buildx imagetools create --prefer-index=false --tag "${app_target}" "${app_source}"
          docker buildx imagetools create --prefer-index=false --tag "${web_target}" "${web_source}"

          target_app_manifest=$(inspect_manifest "${app_target}")
          target_web_manifest=$(inspect_manifest "${web_target}")
          target_app_type=$(jq -r '.mediaType' <<<"${target_app_manifest}")
          target_app_digest=$(jq -r '.digest' <<<"${target_app_manifest}")
          target_web_type=$(jq -r '.mediaType' <<<"${target_web_manifest}")
          target_web_digest=$(jq -r '.digest' <<<"${target_web_manifest}")

          printf 'Promoted stable manifests:\napp: %s (%s)\nweb: %s (%s)\n' \
            "${target_app_digest}" "${target_app_type}" \
            "${target_web_digest}" "${target_web_type}"

          if [[ ${source_app_type} != "${target_app_type}" ]] \
            || [[ ${source_web_type} != "${target_web_type}" ]] \
            || [[ ${source_app_digest} != "${target_app_digest}" ]] \
            || [[ ${source_web_digest} != "${target_web_digest}" ]]
          then
            echo "Stable image manifest types or digests do not match the accepted RC." >&2
            exit 1
          fi

          printf 'Promoted %s to %s\napp: %s\nweb: %s\n' \
            "${CANDIDATE_TAG}" "${RELEASE_TAG}" \
            "${target_app_digest}" "${target_web_digest}"
