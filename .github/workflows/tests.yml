name: tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gn_system_test
          POSTGRES_USER: gn_system
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gn_system -d gn_system_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: false
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: gn_system_test
      DB_USERNAME: gn_system
      DB_PASSWORD: test-password
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: 127.0.0.1
      SESSION_DRIVER: array
      MAIL_MAILER: array

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install PDF font dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes fonts-noto-cjk python3-fonttools
          sudo mkdir -p /usr/local/share/fonts/gn-system
          sudo python3 -c "from fontTools.ttLib import TTCollection; font = TTCollection('/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc').fonts[0]; assert all(ord(char) in font.getBestCmap() for char in '中한가123GN-System'); font.save('/usr/local/share/fonts/gn-system/NotoSansCJK-Regular.otf')"
          test -r /usr/local/share/fonts/gn-system/NotoSansCJK-Regular.otf

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: bcmath, gd, intl, mbstring, pdo_pgsql, redis, zip
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Prepare isolated test environment
        run: |
          cp .env.testing.example .env.testing
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env.testing
          printf '\nDB_PASSWORD=%s\n' "$DB_PASSWORD" >> .env.testing

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Audit dependencies
        run: |
          composer audit
          npm audit --audit-level=high

      - name: Run CI Checks
        run: composer ci:check

  production-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build production images
        run: |
          docker build --target production --tag gn-system-app:ci .
          docker build --target web-production --tag gn-system-web:ci .

      - name: Assert production image contents
        run: |
          docker run --rm --entrypoint sh gn-system-app:ci -ec '
            php -m | grep -qx gd
            test ! -e /var/www/html/.env
            test ! -e /var/www/html/.env.example
            test ! -e /var/www/html/.env.production.example
            test ! -e /var/www/html/.env.uat.example
            test ! -e /var/www/html/public/hot
            test ! -e /var/www/html/public/fonts-manifest.dev.json
            test ! -d /var/www/html/node_modules
            test ! -d /var/www/html/tests
            test ! -d /var/www/html/vendor/phpunit
            ! command -v composer
          '
          docker run --rm --entrypoint sh gn-system-web:ci -ec '
            test ! -e /var/www/html/public/hot
            test ! -e /var/www/html/public/fonts-manifest.dev.json
            test -f /var/www/html/public/build/manifest.json
          '

      - name: Assert environment-specific HTTPS redirects
        run: |
          docker run --rm \
            --entrypoint sh \
            --env EXTERNAL_HTTPS_PORT_SUFFIX= \
            --env 'NGINX_ENVSUBST_FILTER=^EXTERNAL_HTTPS_PORT_SUFFIX$' \
            gn-system-web:ci -ec \
            '/docker-entrypoint.d/20-envsubst-on-templates.sh
             grep -F "return 301 https://\$host\$request_uri;" /etc/nginx/conf.d/default.conf'
          docker run --rm \
            --entrypoint sh \
            --env EXTERNAL_HTTPS_PORT_SUFFIX=:8443 \
            --env 'NGINX_ENVSUBST_FILTER=^EXTERNAL_HTTPS_PORT_SUFFIX$' \
            gn-system-web:ci -ec \
            '/docker-entrypoint.d/20-envsubst-on-templates.sh
             grep -F "return 301 https://\$host:8443\$request_uri;" /etc/nginx/conf.d/default.conf'

      - name: Validate production and UAT Compose
        run: |
          cp .env.production.example .env.production
          cp .env.uat.example .env.uat
          sed -i 's|^APP_IMAGE=.*|APP_IMAGE=gn-system-app|' .env.production
          sed -i 's|^WEB_IMAGE=.*|WEB_IMAGE=gn-system-web|' .env.production
          sed -i 's|^RELEASE_TAG=.*|RELEASE_TAG=ci|' .env.production
          sed -i 's|^APP_KEY=.*|APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=|' .env.production
          sed -i 's|^DB_PASSWORD=.*|DB_PASSWORD=ci-database-password|' .env.production
          sed -i 's|^REDIS_PASSWORD=.*|REDIS_PASSWORD=ci-redis-password|' .env.production
          sed -i 's|^BACKUP_ARCHIVE_PASSWORD=.*|BACKUP_ARCHIVE_PASSWORD=ci-backup-password|' .env.production
          sed -i 's|^APP_IMAGE=.*|APP_IMAGE=gn-system-app|' .env.uat
          sed -i 's|^WEB_IMAGE=.*|WEB_IMAGE=gn-system-web|' .env.uat
          sed -i 's|^RELEASE_TAG=.*|RELEASE_TAG=ci-uat|' .env.uat
          sed -i 's|^APP_KEY=.*|APP_KEY=base64:BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB=|' .env.uat
          sed -i 's|^DB_PASSWORD=.*|DB_PASSWORD=ci-uat-database-password|' .env.uat
          sed -i 's|^REDIS_PASSWORD=.*|REDIS_PASSWORD=ci-uat-redis-password|' .env.uat
          sed -i 's|^BACKUP_ARCHIVE_PASSWORD=.*|BACKUP_ARCHIVE_PASSWORD=ci-uat-backup-password|' .env.uat

          production_config=$(docker compose --env-file .env.production \
            -f compose.production.yaml config --format json)
          uat_config=$(docker compose --env-file .env.uat \
            -f compose.production.yaml config --format json)

          jq -e '.name == "gn-system-production"' <<<"${production_config}"
          jq -e '.services.web.ports[] | select(.target == 80 and .published == "80")' \
            <<<"${production_config}"
          jq -e '.services.web.ports[] | select(.target == 443 and .published == "443")' \
            <<<"${production_config}"
          jq -e '.services.app.environment.APP_NAME == "GN-System CRM"' \
            <<<"${production_config}"
          jq -e '.services.app.environment.OFFSITE_BACKUP_MONITOR_ENABLED == "true"' \
            <<<"${production_config}"
          jq -e '.services.app.volumes[] | select(.source == "/srv/gn-system/production/data/private")' \
            <<<"${production_config}"

          jq -e '.name == "gn-system-uat"' <<<"${uat_config}"
          jq -e '.services.web.ports[] | select(.target == 80 and .published == "8080")' \
            <<<"${uat_config}"
          jq -e '.services.web.ports[] | select(.target == 443 and .published == "8443")' \
            <<<"${uat_config}"
          jq -e '.services.app.environment.APP_NAME == "GN-System CRM UAT"' \
            <<<"${uat_config}"
          jq -e '.services.app.environment.OFFSITE_BACKUP_MONITOR_ENABLED == "false"' \
            <<<"${uat_config}"
          jq -e '.services.app.volumes[] | select(.source == "/srv/gn-system/data/private")' \
            <<<"${uat_config}"

          ! docker compose --env-file .env.production -f compose.production.yaml \
            config --services | grep -qx vite
          ! grep -q '/var/www/html:' <<<"${production_config}"
          ! grep -q '/srv/gn-system/production/data/' <<<"${uat_config}"
          ! grep -q '/srv/gn-system/data/' <<<"${production_config}"
