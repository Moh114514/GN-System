name: tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gn_system_test
          POSTGRES_USER: gn_system
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gn_system -d gn_system_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: false
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: gn_system_test
      DB_USERNAME: gn_system
      DB_PASSWORD: test-password
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: 127.0.0.1
      SESSION_DRIVER: array
      MAIL_MAILER: array

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: bcmath, intl, mbstring, pdo_pgsql, redis, zip
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Audit dependencies
        run: |
          composer audit
          npm audit --audit-level=high

      - name: Run CI Checks
        run: composer ci:check

  production-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build production images
        run: |
          docker build --target production --tag gn-system-app:ci .
          docker build --target web-production --tag gn-system-web:ci .

      - name: Assert production image contents
        run: |
          docker run --rm --entrypoint sh gn-system-app:ci -ec '
            test ! -e /var/www/html/.env
            test ! -e /var/www/html/.env.example
            test ! -e /var/www/html/.env.production.example
            test ! -e /var/www/html/public/hot
            test ! -e /var/www/html/public/fonts-manifest.dev.json
            test ! -d /var/www/html/node_modules
            test ! -d /var/www/html/tests
            test ! -d /var/www/html/vendor/phpunit
            ! command -v composer
          '
          docker run --rm --entrypoint sh gn-system-web:ci -ec '
            test ! -e /var/www/html/public/hot
            test ! -e /var/www/html/public/fonts-manifest.dev.json
            test -f /var/www/html/public/build/manifest.json
          '

      - name: Validate production Compose
        run: |
          cp .env.production.example .env.production
          sed -i 's|^APP_IMAGE=.*|APP_IMAGE=gn-system-app|' .env.production
          sed -i 's|^WEB_IMAGE=.*|WEB_IMAGE=gn-system-web|' .env.production
          sed -i 's|^RELEASE_TAG=.*|RELEASE_TAG=ci|' .env.production
          sed -i 's|^APP_KEY=.*|APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=|' .env.production
          sed -i 's|^DB_PASSWORD=.*|DB_PASSWORD=ci-database-password|' .env.production
          sed -i 's|^REDIS_PASSWORD=.*|REDIS_PASSWORD=ci-redis-password|' .env.production
          sed -i 's|^BACKUP_ARCHIVE_PASSWORD=.*|BACKUP_ARCHIVE_PASSWORD=ci-backup-password|' .env.production
          docker compose --env-file .env.production -f compose.production.yaml config --quiet
          ! docker compose --env-file .env.production -f compose.production.yaml config --services | grep -qx vite
          ! docker compose --env-file .env.production -f compose.production.yaml config | grep -q '/var/www/html:'
