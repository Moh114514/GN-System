name: ${COMPOSE_PROJECT_NAME:-gn-system}

x-app-base: &app-base
  build:
    context: .
    target: development
    args:
      APP_UID: ${APP_UID:-1000}
      APP_GID: ${APP_GID:-1000}
  image: gn-system/app:development
  env_file:
    - .env
  volumes:
    - ./:/var/www/html
    - composer_vendor:/var/www/html/vendor
    - backup_data:/var/www/html/storage/app/backups
  networks:
    - backend
    - egress
  restart: unless-stopped

services:
  app:
    <<: *app-base
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - frontend
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  queue:
    <<: *app-base
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *app-base
    command: php artisan schedule:work
    depends_on:
      app:
        condition: service_healthy

  vite:
    image: node:22-alpine
    working_dir: /var/www/html
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_PUBLIC_HOST: ${VITE_PUBLIC_HOST:-localhost}
      VITE_PUBLIC_PORT: ${VITE_PORT:-5173}
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - ./:/var/www/html
      - node_modules:/var/www/html/node_modules
    networks:
      - frontend
    restart: unless-stopped

networks:
  frontend:
  backend:
    internal: true
  egress:

volumes:
  backup_data:
  composer_vendor:
  node_modules:
  postgres_data:
  redis_data:
